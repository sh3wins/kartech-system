<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kartech Workshop</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111210">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=1">
</head>
<body>

<header class="top">
  <div class="brand">KARTECH<small>ENGINEERING · WORKSHOP</small></div>
  <span class="live hidden" id="live"><i></i> Live</span>
  <span class="who hidden" id="who"></span>
  <button class="btn line hidden" id="outBtn">Sign out</button>
</header>

<!-- sign in -->
<section class="login hidden" id="loginView">
  <form class="box" id="loginForm">
    <h1>Owner sign in</h1>
    <p class="sub">Orders, jobs and workers for the Kartech workshop.</p>
    <label class="field"><span>Email</span><input id="lEmail" type="email" autocomplete="username" required></label>
    <label class="field"><span>Password</span><input id="lPass" type="password" autocomplete="current-password" required></label>
    <p id="lErr" style="color:var(--red);min-height:20px;font-size:13px"></p>
    <button class="btn" id="lBtn">Sign in</button>
    <p class="sub" style="margin:16px 0 0;font-size:13px">Workshop computer? Open <a href="station.html">station.html</a> instead.</p>
  </form>
</section>

<section class="login hidden" id="setupView"><div class="box"><h1>Not set up yet</h1><p class="sub">Add the Supabase keys in js/config.js.</p></div></section>

<main id="owner" class="owner hidden">
  <nav class="tabs">
    <button data-tab="today" class="on">Today <span class="badge" id="attnBadge"></span></button>
    <button data-tab="orders">Orders</button>
    <button data-tab="workshop">Workshop</button>
    <button data-tab="workers">Workers</button>
    <span class="spacer"></span>
    <button class="btn newbtn" id="newOrderBtn">+ New order</button>
  </nav>
  <section id="view"><p class="empty">Loading…</p></section>
</main>
<button class="fab hidden" id="fab" aria-label="New order">+</button>

<div class="toast" id="toast"></div>
<div class="alarm hidden" id="alarm"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js?v=1"></script>
<script src="js/owner.js?v=1"></script>
<script>if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
</body>
</html>
