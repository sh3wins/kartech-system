<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check a Kartech receipt</title>
<meta name="theme-color" content="#185844">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--deep:#185844;--ink:#102F27;--bg:#F2EBDD;--gold:#B08A4F;--muted:#5F6F64;--line:#E3D9C6;--red:#B42318}
  *{box-sizing:border-box;margin:0}
  body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center}
  header{width:100%;background:var(--deep);color:#fff;padding:18px 20px 54px;display:flex;align-items:center;gap:10px}
  header b{letter-spacing:.14em;font-size:15px}
  main{width:100%;max-width:440px;padding:0 16px;margin-top:-36px}
  .card{background:#fff;border-radius:22px;padding:24px 22px;box-shadow:0 10px 28px rgba(16,47,39,.08);display:flex;flex-direction:column;gap:14px}
  .badge{display:flex;align-items:center;gap:12px}
  .badge i{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:24px;font-weight:700;color:#fff;background:#2E7D4F;flex:none}
  .badge.bad i{background:var(--red)}
  h1{font-family:'Fraunces',Georgia,serif;font-size:24px;line-height:1.2}
  .sub{color:var(--muted);font-size:14.5px;line-height:1.5}
  dl{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;font-size:15px;border-top:1px solid var(--line);padding-top:14px}
  dt{color:var(--muted)} dd{font-weight:700;text-align:right}
  .amt{font-family:'Fraunces',Georgia,serif;font-size:30px;color:var(--deep)}
  .foot{font-size:12.5px;color:var(--muted);text-align:center;margin:18px 0 30px;line-height:1.5}
</style>
</head>
<body>
<header><svg width="24" height="24" viewBox="0 0 40 40" aria-hidden="true"><path d="M6 4h8v13L26 4h10L22 19l15 17H26L14 22v14H6z" fill="#B08A4F"/></svg><b>KARTECH</b></header>
<main><div class="card" id="v"><p class="sub">Checking…</p></div>
<p class="foot">Kartech Engineering · Umoja, Nairobi<br>This page only confirms documents made by Kartech's own system.</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js?v=3"></script>
<script>
(async function(){
  const v = document.getElementById('v');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const money = n => 'KSh ' + Number(n || 0).toLocaleString('en-KE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const code = (new URLSearchParams(location.search).get('k') || '').trim();
  const bad = (t, s) => v.innerHTML = `<div class="badge bad"><i>!</i><h1>${t}</h1></div><p class="sub">${s}</p>`;
  if (!code) return bad('Nothing to check', 'Scan the QR code on a Kartech invoice or receipt.');
  if (!db) return bad('Could not connect', 'Check the internet and try again.');
  const { data, error } = await db.rpc('kt_check', { p_code: code });
  if (error) return bad('Could not check', 'Check the internet and try again.');
  if (!data) return bad('Not a Kartech document', 'We could not find this code. If someone gave you this paper as a Kartech receipt, call Kartech to confirm.');
  const isR = data.type === 'receipt', when = new Date(data.at);
  v.innerHTML = `<div class="badge"><i>✓</i><div><h1>Genuine Kartech ${isR ? 'receipt' : 'invoice'}</h1></div></div>
    <p class="sub">${isR ? 'Kartech received this payment and recorded it.' : 'This invoice was made by Kartech.'}</p>
    <div><p class="sub">${isR ? 'Amount paid' : 'Invoice total'}</p><p class="amt">${money(data.amount)}</p></div>
    <dl><dt>${isR ? 'Receipt' : 'Invoice'}</dt><dd>${esc(data.no)}</dd>
      ${isR ? `<dt>For invoice</dt><dd>${esc(data.invoice)}</dd><dt>Paid by</dt><dd>${esc(data.method)}</dd>` : ''}
      <dt>Order</dt><dd>${esc(data.order || '—')}</dd><dt>Customer</dt><dd>${esc(data.customer)}</dd>
      <dt>Date</dt><dd>${when.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' })} · ${when.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' })}</dd></dl>`;
})();
</script>
</body>
</html>
