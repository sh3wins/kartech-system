<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Kartech order</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1F3A2A">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --forest:#1F3A2A; --leaf:#2E6B45; --leaf2:#9CC4A8; --soft:#E7F1EA; --paper:#F4F3EE; --line:#E1DED4; --ink:#141A15; --muted:#5E6A62; --red:#B83A2E; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  .top{background:var(--forest);color:#fff;padding:16px 18px 48px;display:flex;align-items:center;justify-content:space-between}
  .logo{display:flex;align-items:center;gap:10px;font-family:'Archivo',sans-serif;font-weight:800;letter-spacing:.12em;font-size:15px}
  .logo svg{width:24px;height:24px}
  .top small{color:#CFE0D4;font-size:13px}
  main{max-width:560px;margin:-32px auto 0;padding:0 14px 120px;display:flex;flex-direction:column;gap:12px}
  .card{background:#fff;border-radius:20px;padding:18px;box-shadow:0 8px 24px rgba(20,30,20,.07)}
  .k{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--muted)}
  h1{font-family:'Archivo',sans-serif;font-size:26px;line-height:1.12;margin:4px 0}
  h2{font-family:'Archivo',sans-serif;font-size:16px;margin:6px 2px 0}
  .sub{color:var(--muted);font-size:14px}
  .bar{display:flex;gap:4px;margin:14px 0 6px}
  .bar i{flex:1;height:6px;border-radius:3px;background:var(--line)}
  .bar i.done{background:var(--leaf)} .bar i.working{background:var(--leaf2)}
  .barlab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
  .barlab b{color:var(--forest)}
  .ok{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--forest);margin-top:12px}
  .ok svg{flex:none}
  .ask{background:#FFF7E6;border:1.5px solid #EBCB8B}
  .ask p{margin:4px 0 12px;color:#5A4A2A;line-height:1.45;font-size:14.5px}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:16px;border:0;background:var(--forest);color:#fff;font-family:'Archivo',sans-serif;font-weight:700;font-size:16px;padding:0 16px}
  .btn.green{background:var(--leaf)}
  .btn.line{background:#fff;color:var(--forest);border:1.5px solid var(--line);font-family:'Inter',sans-serif;font-weight:600;font-size:15px;min-height:48px}
  .pics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .pic{aspect-ratio:1;border-radius:14px;overflow:hidden;background:#DCD6C8;border:0;padding:0}
  .pic img{width:100%;height:100%;object-fit:cover;display:block}
  .add{aspect-ratio:1;border-radius:14px;border:2px dashed #9CB3A3;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--leaf);font-size:13px;font-weight:600}
  .msgs{display:flex;flex-direction:column;gap:8px}
  .msg{max-width:82%;padding:10px 13px;border-radius:16px;font-size:14.5px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
  .msg small{display:block;font-size:11px;opacity:.65;margin-top:4px}
  .msg.me{align-self:flex-end;background:var(--forest);color:#fff;border-bottom-right-radius:5px}
  .msg.them{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px}
  .empty{color:var(--muted);font-size:14px;padding:6px 2px}
  .composer{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px))}
  .composer form{max-width:560px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
  .icon{width:50px;height:50px;flex:none;border-radius:15px;border:1.5px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center}
  .composer textarea{flex:1;min-height:50px;max-height:120px;resize:none;border:1.5px solid var(--line);border-radius:15px;padding:13px 14px;font-size:16px;background:#fff}
  .composer textarea:focus{outline:none;border-color:var(--leaf)}
  .send{width:50px;height:50px;flex:none;border-radius:15px;border:0;background:var(--forest);display:flex;align-items:center;justify-content:center}
  .sheet{position:fixed;inset:0;z-index:40;background:rgba(10,20,14,.55);display:flex;align-items:flex-end;justify-content:center}
  .sheet > div{background:var(--paper);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
  .details{background:#fff;border-radius:16px;padding:14px 16px;white-space:pre-wrap;line-height:1.5;font-size:15px}
  .full{position:fixed;inset:0;z-index:50;background:rgba(5,10,7,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
  .full img{max-width:100%;max-height:82vh;border-radius:10px}
  .full button{position:absolute;top:14px;right:14px;background:#fff;border:0;border-radius:12px;padding:10px 14px;font-weight:600}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--forest);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;transition:all .25s;pointer-events:none;z-index:60;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .center{text-align:center;padding:40px 10px}
  .hidden{display:none!important}
</style>
</head>
<body>
<header class="top">
  <div class="logo"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M6 4h8v13L26 4h10L22 19l15 17H26L14 22v14H6z" fill="currentColor"/></svg>KARTECH</div>
  <small>Your order room</small>
</header>
<main id="view"><div class="card center"><p class="sub">Opening your order…</p></div></main>

<div class="composer hidden" id="composer">
  <form id="msgForm">
    <button type="button" class="icon" id="photoBtn" aria-label="Add a photo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1F3A2A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.5"/></svg>
    </button>
    <textarea id="msgIn" rows="1" placeholder="Write to Kartech…" aria-label="Message to Kartech"></textarea>
    <button class="send" aria-label="Send message">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l16-8-6 16-2-7z"/></svg>
    </button>
  </form>
  <input type="file" id="photoIn" accept="image/*" multiple hidden>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js?v=3"></script>
<script>
(function(){
  const code = (new URLSearchParams(location.search).get('c') || '').trim().toLowerCase();
  const v = $('#view');
  let R = null, busy = false, lastJson = '';
  const pub = p => db.storage.from('room-files').getPublicUrl(p).data.publicUrl;
  const when = t => new Date(t).toLocaleString('en-GB', { weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
  const day = t => new Date(t).toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
  const tick = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2E6B45" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>';

  if (!db){ v.innerHTML = '<div class="card center"><h1>Not available</h1><p class="sub">Please try again later.</p></div>'; return; }
  if (!code){ v.innerHTML = '<div class="card center"><h1>Your order room</h1><p class="sub">Open the link Kartech sent you, or scan the code in the shop.</p></div>'; return; }

  async function load(){
    if (busy) return; busy = true;
    try {
      const { data, error } = await db.rpc('ws_room', { p_code: code });
      if (error) throw error;
      if (!data){ v.innerHTML = '<div class="card center"><h1>We could not find this order</h1><p class="sub">Check the link Kartech sent you, or ask us for a new one.</p></div>'; return; }
      const j = JSON.stringify(data); if (j === lastJson) return; lastJson = j; R = data; render();
    } catch(e){ if (!R) v.innerHTML = '<div class="card center"><h1>No connection</h1><p class="sub">Check your internet. We will try again.</p></div>'; }
    finally { busy = false; }
  }

  function render(){
    const steps = R.steps || [], cur = steps.find(s => s.status !== 'done'), allDone = steps.length && !cur;
    const status = R.delivered ? 'Delivered. Thank you!' : allDone ? 'Ready ✓' : cur ? (cur.status === 'working' ? 'Now: ' : 'Next: ') + cur.name : 'Getting ready';
    v.innerHTML = `
      <section class="card">
        <span class="k">ORDER ${esc(R.ref)}</span>
        <h1>${R.qty} × ${esc(R.item)}</h1>
        <span class="sub">${R.name ? esc(R.name) + ' · ' : ''}Ready by ${esc(day(R.deadline + 'T12:00'))}${R.delivery_on ? ' · Delivery ' + esc(day(R.delivery_on + 'T12:00')) : ''}</span>
        <div class="bar">${steps.map(s => `<i class="${s.status}" title="${esc(s.name)}"></i>`).join('')}</div>
        <div class="barlab"><span>${esc(steps[0] ? steps[0].name : '')}</span><b>${esc(status)}</b><span>Ready</span></div>
        ${R.approved_at ? `<div class="ok">${tick}<span><b>You approved the design</b> · ${esc(day(R.approved_at))}</span></div>` : ''}
      </section>

      ${R.approved_at || R.delivered ? '' : `<section class="card ask">
        <b style="font-family:'Archivo',sans-serif;font-size:17px">Check your design</b>
        <p>Before we start, make sure we have it exactly right: the photos and the details. Then tap approve.</p>
        <button class="btn green" id="reviewBtn">Review and approve</button>
      </section>`}

      <h2>Your pictures</h2>
      <div class="pics">${(R.photos || []).map((p, i) => `<button class="pic" data-pic="${i}" aria-label="Open picture ${i + 1}"><img src="${esc(pub(p.path))}" alt="" loading="lazy"></button>`).join('')}
        <button class="add" id="addTile">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2E6B45" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add photo</button></div>

      <h2>Messages</h2>
      <div class="msgs" id="msgs">${(R.msgs || []).length ? R.msgs.map(m => `<div class="msg ${m.who === 'customer' ? 'me' : 'them'}">${esc(m.text)}<small>${m.who === 'customer' ? 'You' : 'Kartech'} · ${esc(when(m.at))}</small></div>`).join('')
        : '<p class="empty">Ask anything or tell us a detail. Kartech will reply here.</p>'}</div>`;
    $('#composer').classList.remove('hidden');
    const rb = $('#reviewBtn'); if (rb) rb.onclick = review;
    $('#addTile').onclick = () => $('#photoIn').click();
    v.querySelectorAll('[data-pic]').forEach(b => b.onclick = () => full(+b.dataset.pic));
    const ms = $('#msgs'); if (ms && ms.lastElementChild) ms.lastElementChild.scrollIntoView({ block:'nearest' });
  }

  function full(i){
    const ps = R.photos || []; if (!ps[i]) return;
    const o = document.createElement('div'); o.className = 'full';
    o.innerHTML = `<img src="${esc(pub(ps[i].path))}" alt="Picture ${i + 1}"><button>Close</button>${ps.length > 1 ? `<p style="color:#ccc;font-size:14px">${i + 1} of ${ps.length} · tap for the next</p>` : ''}`;
    o.onclick = e => { o.remove(); if (!e.target.closest('button') && ps.length > 1) full((i + 1) % ps.length); };
    document.body.appendChild(o);
  }

  function review(){
    const s = document.createElement('div'); s.className = 'sheet';
    s.innerHTML = `<div>
      <span class="k">${esc(R.ref)} · BEFORE WE START</span>
      <h1 style="font-size:24px">Is this what you want?</h1>
      <p class="sub">Check every detail. We make exactly this.</p>
      <div class="details"><b>${R.qty} × ${esc(R.item)}</b>${R.notes ? '\n' + esc(R.notes) : ''}\nReady by ${esc(day(R.deadline + 'T12:00'))}</div>
      ${(R.photos || []).length ? `<div class="pics">${R.photos.map(p => `<div class="pic"><img src="${esc(pub(p.path))}" alt=""></div>`).join('')}</div>` : '<p class="sub">No pictures yet. You can add one before approving.</p>'}
      <button class="btn green" id="yes">${tick.replace('#2E6B45', '#fff')} Yes, this is what I want</button>
      <button class="btn line" id="no">Something is wrong, let me show you</button>
      <button class="btn line" id="later" style="border:0;background:transparent">Not now</button>
    </div>`;
    document.body.appendChild(s);
    s.addEventListener('click', e => { if (e.target === s) s.remove(); });
    s.querySelector('#later').onclick = () => s.remove();
    s.querySelector('#no').onclick = () => { s.remove(); const t = $('#msgIn'); t.value = 'Something is wrong: '; t.focus(); toast('Tell us what to change, and add a photo if it helps.'); };
    s.querySelector('#yes').onclick = async e => { e.currentTarget.disabled = true;
      const { error } = await db.rpc('ws_room_approve', { p_code: code });
      s.remove(); if (error) return toast(errMsg(error));
      toast('Thank you! We will make exactly this.'); lastJson = ''; load(); };
  }

  // photos: made smaller on the phone, then sent into this room's own folder
  function shrink(file){
    return new Promise((ok, no) => { const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => { const k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url); c.toBlob(b => b ? ok(b) : no(new Error('photo')), 'image/jpeg', .82); };
      img.onerror = () => { URL.revokeObjectURL(url); no(new Error('That file is not a photo')); }; img.src = url; });
  }
  $('#photoBtn').onclick = () => $('#photoIn').click();
  $('#photoIn').addEventListener('change', async e => {
    const fs = [...e.target.files].filter(f => /^image\//.test(f.type)).slice(0, 6); e.target.value = '';
    let n = 0;
    for (const f of fs){
      toast(`Sending photo ${n + 1} of ${fs.length}…`);
      try {
        const blob = await shrink(f);
        const name = (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2)) + '.jpg';
        const path = `room/${code}/${name}`;
        const up = await db.storage.from('room-files').upload(path, blob, { contentType:'image/jpeg', upsert:false });
        if (up.error) throw up.error;
        const { error } = await db.rpc('ws_room_add_photo', { p_code: code, p_path: path });
        if (error) throw error;
        n++;
      } catch(err){ toast(errMsg(err)); }
    }
    if (n){ toast(n > 1 ? `${n} photos sent ✓ Kartech can see them now.` : 'Photo sent ✓ Kartech can see it now.'); lastJson = ''; load(); }
  });

  const mi = $('#msgIn');
  mi.addEventListener('input', () => { mi.style.height = 'auto'; mi.style.height = Math.min(120, mi.scrollHeight) + 'px'; });
  $('#msgForm').addEventListener('submit', async e => {
    e.preventDefault(); const t = mi.value.trim(); if (!t) return;
    const { error } = await db.rpc('ws_room_message', { p_code: code, p_text: t });
    if (error) return toast(errMsg(error));
    mi.value = ''; mi.style.height = 'auto'; lastJson = ''; load();
  });

  load();
  setInterval(() => { if (document.visibilityState === 'visible') load(); }, 15000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') load(); });
})();
</script>
</body>
</html>
