<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kartech Workshop Screen</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1F3A2A">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=5">
<link rel="stylesheet" href="css/station.css?v=4">
</head>
<body class="sw">

<div class="sw-shell">
  <aside class="sw-side">
    <div class="logo"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M6 4h8v13L26 4h10L22 19l15 17H26L14 22v14H6z" fill="currentColor"/></svg><span>KARTECH<small>ENGINEERING</small></span></div>
    <div class="sw-clock"><b id="clk">--:--</b><span id="clkDate"></span></div>
    <span class="live hidden" id="live"><i></i> Live</span>
  </aside>

  <main class="sw-main">
    <!-- one-time setup: sign this computer in with the workshop account -->
    <section class="sw-set hidden" id="setView">
      <form class="sw-card" id="setForm">
        <h1>Set up this computer</h1>
        <p class="lead">Sign in once with the <b>workshop</b> account. After that, workers just tap their name.</p>
        <label class="field"><span>Workshop account email</span><input id="sEmail" type="email" autocomplete="username" required></label>
        <label class="field"><span>Password</span><input id="sPass" type="password" autocomplete="current-password" required></label>
        <p id="sErr" style="color:#C2412D;min-height:20px;font-size:13px"></p>
        <button class="btn" id="sBtn">Set up</button>
      </form>
    </section>
    <div id="stView"></div>
  </main>
</div>

<div class="sw-cheer hidden" id="cheer"><div><span class="tick"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="24"/><path d="M14 27l8 8 16-17"/></svg></span><p id="cheerTxt">Well done!</p></div></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js?v=2"></script>
<script src="js/station.js?v=6"></script>
</body>
</html>
